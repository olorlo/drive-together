<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이 가요</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F1EEFA; --panel:#FFFFFF; --ink:#3A3352; --muted:#8A85A0; --line:#E2DDF0; --soft:#F7F5FC; --accent:#7182F6; --butter:#FFE27A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1A2A; --panel:#27233A; --ink:#EEEAF8; --muted:#A29DBA; --line:#3A3552; --soft:#2F2A45; --accent:#9AA6FF; --butter:#FFE27A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1A2A; --panel:#27233A; --ink:#EEEAF8; --muted:#A29DBA; --line:#3A3552; --soft:#2F2A45; --accent:#9AA6FF; --butter:#FFE27A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid #7182F6;outline-offset:2px}
.jua{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}

.page{max-width:1740px;margin:0 auto;padding:26px clamp(14px,3vw,40px) 56px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 30px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-family:"Jua",sans-serif;font-weight:400;font-size:34px;line-height:1.1}
.brand p{margin:4px 0 0;color:var(--muted);font-size:15px;max-width:58ch}
.viewer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.viewer span.lbl{font-size:14px;color:var(--muted);margin-right:2px}
.vbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 16px 5px 6px;cursor:pointer;font-family:"Jua",sans-serif;font-size:17px}
.vbtn small{font-family:"Gowun Dodum",sans-serif;color:var(--muted);font-size:13px}
.vbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:1240px){.layout{grid-template-columns:1fr}}
.stage{overflow-x:auto;padding-bottom:6px}
.frame{width:calc(1304px * var(--s,1));height:calc(664px * var(--s,1))}
.bezel{width:1304px;height:664px;padding:12px;border-radius:36px;background:#2B2640;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 26px 50px -30px rgba(43,38,64,.6)}
.sources{font-size:13px;color:var(--muted);margin:10px 4px 0;max-width:95ch}

/* ---------- device ---------- */
.screen{width:1280px;height:640px;border-radius:26px;overflow:hidden;position:relative;background:#EEF5E6;color:#3A3352;font-family:"Jua",sans-serif;color-scheme:light}
.sbar{position:absolute;inset:0 0 auto 0;height:40px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.82);backdrop-filter:blur(6px);font-size:17px}
.sbar .l,.sbar .r{display:flex;gap:12px;align-items:center;min-width:260px}
.sbar .r{justify-content:flex-end;font-size:15px}
.sbar .mid{display:flex;align-items:center;gap:8px;font-size:18px}
.sbar .mid small{font-family:"Gowun Dodum",sans-serif;color:#8A85A0;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;background:#F1EEFA;font-size:14px}
.pill .g{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#7182F6;color:#fff;font-size:12px}
.ndot{width:8px;height:8px;border-radius:50%;background:#43C08A;display:inline-block}
.ndot.bad{background:#FF7A6B}

.map{position:absolute;inset:40px 0 0 0;overflow:hidden}
.map svg.world{position:absolute;inset:0;width:100%;height:100%;display:block}
.lbl-city{font-family:"Jua",sans-serif;font-size:34px;fill:#A3AE97;paint-order:stroke;stroke:#EEF5E6;stroke-width:6px}
.lbl-ra{font-family:"Jua",sans-serif;font-size:19px;fill:#3D7A57;paint-order:stroke;stroke:#fff;stroke-width:5px}
.lbl-road{font-family:"Jua",sans-serif;font-size:16px;fill:#B39A54;paint-order:stroke;stroke:#fff;stroke-width:4px}
.lbl-water{font-family:"Jua",sans-serif;font-size:20px;fill:#7FB7D6}
#route-new{animation:draw 1.3s ease-out forwards}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

/* cars */
.cars{position:absolute;inset:0;pointer-events:none}
.car{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.car .body{position:absolute;left:-30px;top:-20px;width:60px;height:40px}
.car .ring{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;background:rgba(113,130,246,.18);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.35);opacity:0}}
.car .name{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:2.5px solid var(--c);border-radius:999px;padding:0 10px;font-size:15px;line-height:24px;box-shadow:0 3px 8px rgba(58,51,82,.14)}
.car.me .name{background:var(--c);color:#fff}
.car.off{opacity:.55}
.car.off .name{border-style:dashed}
.bub{position:absolute;left:20px;bottom:22px;pointer-events:auto;border:0;cursor:pointer;white-space:nowrap;background:#fff;border-radius:18px;padding:6px 14px;font-family:"Jua",sans-serif;font-size:17px;box-shadow:0 5px 14px rgba(58,51,82,.2);transform-origin:0 100%}
.bub::after{content:"";position:absolute;left:8px;bottom:-7px;border:8px solid transparent;border-top-color:inherit;border-bottom:0;border-left-width:2px;border-right-width:12px;border-top-color:var(--bt,#fff)}
.bub.q{background:#FFE27A;--bt:#FFE27A;font-size:30px;line-height:1;padding:8px 18px;animation:bob 1.1s ease-in-out infinite}
.bub.q .why{font-size:22px;margin-right:4px}
.bub .one{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:11px;background:#FF7A59;color:#fff;font-size:14px;line-height:22px;text-align:center;padding:0 5px}
.bub.mine{background:#FFE27A;--bt:#FFE27A}
.bub.rest{background:#DDF4E6;--bt:#DDF4E6}
.bub.pop{animation:popin .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* overlay cards */
.turn{position:absolute;top:16px;left:16px;width:350px;background:#7182F6;color:#fff;border-radius:26px;padding:14px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 24px -10px rgba(113,130,246,.8);z-index:5}
.turn .arrow{width:62px;height:62px;border-radius:20px;background:#fff;display:grid;place-items:center;flex:none;font-size:30px}
.turn .dist{font-size:32px;line-height:1.05}
.turn .what{font-size:18px;opacity:.95}
.turn.rest{background:#43B07A}
.grp{position:absolute;top:16px;right:16px;width:276px;background:#fff;border-radius:26px;padding:12px 14px;box-shadow:0 10px 24px -14px rgba(58,51,82,.45);z-index:5}
.grp h4{margin:0 0 6px;font-weight:400;font-size:17px;display:flex;justify-content:space-between}
.grp h4 small{font-family:"Gowun Dodum",sans-serif;color:#8A85A0;font-size:13px}
.gr{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1.5px dashed #ECE8F6}
.gr:first-of-type{border-top:0}
.gr .nm{font-size:17px;line-height:1.1}
.gr .st{font-family:"Gowun Dodum",sans-serif;font-size:13px;color:#8A85A0}
.gr .q{background:#FFE27A;border-radius:10px;padding:0 8px;font-size:16px;border:0;cursor:pointer}
.face{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c)}
.bar{position:absolute;left:16px;right:16px;bottom:16px;height:88px;background:#fff;border-radius:30px;display:flex;align-items:center;gap:14px;padding:0 14px 0 26px;box-shadow:0 10px 26px -14px rgba(58,51,82,.5);z-index:6}
.eta b{font-size:34px;font-weight:400;line-height:1}
.eta small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:15px;color:#8A85A0;margin-top:2px}
.eta .chg{font-family:"Jua",sans-serif;font-size:15px;color:#7182F6;margin-left:8px}
.sp{flex:1}
.kb{height:62px;border:0;border-radius:22px;padding:0 22px;font-family:"Jua",sans-serif;font-size:20px;cursor:pointer;background:#F1EEFA;color:#3A3352;display:inline-flex;align-items:center;gap:8px}
.kb.y{background:#FFE27A}
.kb.p{background:#7182F6;color:#fff}
.kb.g{background:#43B07A;color:#fff}
.kb:disabled{opacity:.42;cursor:not-allowed}
.kb .e{font-size:24px}
.zoom{position:absolute;right:16px;bottom:120px;display:flex;flex-direction:column;gap:8px;z-index:5}
.zoom button{width:54px;height:54px;border-radius:18px;border:0;background:#fff;font-size:26px;cursor:pointer;box-shadow:0 6px 14px -8px rgba(58,51,82,.6);font-family:"Jua",sans-serif}
.zoom button[aria-pressed="true"]{background:#7182F6;color:#fff}

.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:13;background:#3A3352;color:#fff;border-radius:22px;padding:12px 22px;font-size:19px;text-align:center;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);animation:drop .45s cubic-bezier(.3,1.5,.6,1);cursor:pointer;max-width:520px;border:0}
.toast small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:14px;opacity:.85}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

.nudge{position:absolute;left:16px;bottom:118px;z-index:7;background:#fff;border-radius:22px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;font-size:18px;box-shadow:0 10px 24px -12px rgba(58,51,82,.5)}
.nudge .kb{height:46px;font-size:16px;padding:0 14px;border-radius:14px}

/* chat */
.chat{position:absolute;top:16px;right:306px;width:430px;z-index:14;background:#C9DCEB;border-radius:28px;padding:14px;box-shadow:0 16px 40px -14px rgba(58,51,82,.55);animation:popin .3s cubic-bezier(.3,1.4,.6,1);transform-origin:100% 0}
.chat .hd{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;font-size:17px}
.chat .x{border:0;background:rgba(255,255,255,.6);width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .who{font-size:15px;margin-bottom:3px}
.msg .b{background:#fff;border-radius:4px 18px 18px 18px;padding:10px 14px;font-family:"Gowun Dodum",sans-serif;font-size:18px;line-height:1.45;max-width:300px;position:relative}
.msg .t{font-family:"Gowun Dodum",sans-serif;font-size:12px;color:#5E6B7A;align-self:flex-end;white-space:nowrap}
.msg.me{flex-direction:row-reverse}
.msg.me .b{background:#FFE27A;border-radius:18px 4px 18px 18px}
.info{background:rgba(255,255,255,.75);border-radius:18px;margin:12px 0 0;padding:10px 14px;font-family:"Gowun Dodum",sans-serif;font-size:15px;line-height:1.6}
.info b{font-family:"Jua",sans-serif;font-weight:400;font-size:17px}
.votes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vt{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.75);border-radius:999px;padding:3px 12px 3px 4px;font-size:15px}
.vt .face{width:28px;height:28px}
.chat .acts{display:flex;gap:10px;margin-top:12px}
.chat .acts .kb{flex:1;height:58px}
.chat .acts .kb.w{background:#fff}
.chat .voice{margin-top:8px;text-align:center;font-family:"Gowun Dodum",sans-serif;font-size:14px;color:#4A5566}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(58,51,82,.25);z-index:15}
.sheet{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:820px;background:#fff;border-radius:32px;padding:22px 24px;z-index:16;animation:up .35s cubic-bezier(.3,1.3,.6,1)}
@keyframes up{from{transform:translate(-50%,60px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet h3{margin:0;font-weight:400;font-size:26px;display:flex;justify-content:space-between;align-items:center}
.sheet p.s{margin:2px 0 14px;font-family:"Gowun Dodum",sans-serif;color:#8A85A0;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:2px solid #ECE8F6;background:#fff;border-radius:18px;padding:8px 16px;font-family:"Jua",sans-serif;font-size:19px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chips button[aria-pressed="true"]{border-color:#7182F6;background:#EEF0FF}
.chips button:disabled{opacity:.35;cursor:not-allowed}
.opt{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;border-radius:22px;background:#F7F5FC;padding:12px 14px;margin-bottom:10px}
.opt .ico{width:56px;height:56px;border-radius:18px;background:#DDF4E6;display:grid;place-items:center;font-size:28px}
.opt .ttl{font-size:21px}
.opt .sub{font-family:"Gowun Dodum",sans-serif;font-size:14px;color:#8A85A0}
.opt .etas{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.opt .etas span{font-family:"Gowun Dodum",sans-serif;font-size:13px;background:#fff;border-radius:999px;padding:1px 9px 1px 4px;display:inline-flex;align-items:center;gap:5px}
.opt .etas i{width:12px;height:12px;border-radius:50%;display:inline-block}
.opt.na{opacity:.5}
.opt .kb{height:52px;font-size:18px}
.empty{font-family:"Gowun Dodum",sans-serif;color:#8A85A0;font-size:16px;padding:10px 4px}

.cover{position:absolute;inset:40px 0 0 0;z-index:20;background:rgba(241,238,250,.88);display:grid;place-items:center}
.cover .card{background:#fff;border-radius:34px;padding:34px 40px;text-align:center;max-width:560px;box-shadow:0 20px 50px -24px rgba(58,51,82,.6)}
.cover h2{margin:0 0 6px;font-weight:400;font-size:36px}
.cover p{margin:0 0 20px;font-family:"Gowun Dodum",sans-serif;font-size:17px;color:#6E6887}
.cover .who{display:flex;justify-content:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}

/* ---------- console ---------- */
.console{display:flex;flex-direction:column;gap:12px}
.cb{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:16px}
.cb h3{margin:0 0 4px;font-family:"Jua",sans-serif;font-weight:400;font-size:19px}
.cb .n{margin:0 0 12px;font-size:13px;color:var(--muted)}
.hint{border-color:var(--accent)}
.hint p{margin:4px 0 0;font-size:15px}
.cbtns{display:flex;flex-direction:column;gap:8px}
.cbtn{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--soft);border-radius:16px;padding:8px 12px;font-size:15px;cursor:pointer;text-align:left}
.cbtn b{font-family:"Jua",sans-serif;font-weight:400;font-size:16px}
.cbtn:disabled{opacity:.45;cursor:not-allowed}
.cbtn.go{background:var(--accent);border-color:var(--accent);color:#fff;justify-content:center;margin-top:10px}
.cdot{width:14px;height:14px;border-radius:50%;flex:none}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1.5px dashed var(--line);font-size:15px}
.row2:first-of-type{border-top:0}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.sw{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:5px;font-size:13px}
.log li{display:grid;grid-template-columns:44px 1fr;gap:6px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.reset{border:2px solid var(--line);background:transparent;border-radius:14px;padding:10px;cursor:pointer;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion: reduce){.bub.q,.car .ring{animation:none}}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <svg width="62" height="62" viewBox="0 0 62 62" aria-hidden="true"><rect width="62" height="62" rx="20" fill="#7182F6"/><g transform="translate(9 25)"><rect width="26" height="17" rx="7" fill="#FF9F7A"/><circle cx="18" cy="7" r="2" fill="#3A3352"/><circle cx="22" cy="7" r="2" fill="#3A3352"/></g><g transform="translate(27 14)"><rect width="26" height="17" rx="7" fill="#5EB8FF"/><circle cx="18" cy="7" r="2" fill="#3A3352"/><circle cx="22" cy="7" r="2" fill="#3A3352"/></g><path d="M10 50h42" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6 6"/></svg>
      <div><h1>같이 가요</h1><p>같이 가는 차가 내비 위에 함께 보이고, 휴게소나 경로 요청은 그 차 옆 말풍선으로 와요. 모두 좋다고 하면 경로가 바로 바뀌어요.</p></div>
    </div>
    <div class="viewer" role="group" aria-label="보고 있는 차량 화면">
      <span class="lbl">지금 보는 차</span>
      <button class="vbtn" data-act="view" data-arg="A"><span class="face" style="--c:#5EB8FF;width:32px;height:32px" data-face="A"></span>우리집 <small>전기차</small></button>
      <button class="vbtn" data-act="view" data-arg="B"><span class="face" style="--c:#FF9F7A;width:32px;height:32px" data-face="B"></span>큰집 <small>가솔린</small></button>
      <button class="vbtn" data-act="view" data-arg="C"><span class="face" style="--c:#B79CFF;width:32px;height:32px" data-face="C"></span>작은집 <small>수원 출발</small></button>
    </div>
  </header>
  <div class="layout">
    <div>
      <div class="stage" id="stage"><div class="frame"><div class="bezel"><div class="screen" id="screen">
        <div class="sbar" id="sbar"></div>
        <div class="map" id="map">
          <svg class="world" id="world" aria-label="내비게이션 지도"><g id="cam"><g id="static"></g><g id="dyn"></g></g></svg>
          <div class="cars" id="cars"></div>
          <div id="ui"></div>
        </div>
      </div></div></div></div>
      <p class="sources">시연용 화면이에요. 지도는 영동고속도로 강릉 방향을 단순하게 그린 그림이고, 차량 위치는 경로 재생(약 30배속), 휴게소 시설과 정체는 사전 입력 데이터, 배터리는 Vehicle SDK 에뮬레이터 값을 흉내 낸 값이에요. 그룹 서버 동작도 이 페이지 안에서 흉내 냈어요.</p>
    </div>
    <aside class="console" id="console" aria-label="시연 콘솔"></aside>
  </div>
</div>

<script>
(function(){
/* ================= data ================= */
const IDS=['A','B','C'];
const CAR={
  A:{alias:'우리집',color:'#5EB8FF',kind:'ev',kindLabel:'전기차'},
  B:{alias:'큰집',color:'#FF9F7A',kind:'gas',kindLabel:'가솔린'},
  C:{alias:'작은집',color:'#B79CFF',kind:'hybrid',kindLabel:'하이브리드'}
};
const DEST='강릉 할머니댁', GROUP='추석 강릉 가는 길';
const P=(x,y,tag)=>({x,y,tag});
const PRE={
  A:[P(120,430,'start'),P(300,520)],
  B:[P(40,330,'start'),P(300,520)],

const RA={
  dp:{name:'덕평자연휴게소',x:900,y:700,ent:[860,640],ext:[940,640],fac:{toilet:1,rest:1,snack:1,charge:0,fuel:1}},
  yj:{name:'여주휴게소',x:1450,y:640,ent:[1410,585],ext:[1490,575],fac:{toilet:1,rest:1,snack:1,charge:1,fuel:1}},
  mm:{name:'문막휴게소',x:2050,y:548,ent:[2010,495],ext:[2090,483],fac:{toilet:1,rest:1,snack:1,charge:1,fuel:1}},
  hs:{name:'횡성휴게소',x:2700,y:458,ent:[2660,405],ext:[2740,397],fac:{toilet:1,rest:1,snack:1,charge:1,fuel:1}}

const REASON={
  toilet:{e:'🚻',label:'화장실',stay:10,msg:(ra)=>`화장실이 급해요! ${ra} 잠깐 들를까요?`},
  rest:{e:'☕',label:'쉬고 싶어요',stay:15,msg:(ra)=>`조금 쉬었다 갈까요? ${ra} 어때요?`},
  snack:{e:'🍡',label:'간식',stay:15,msg:(ra)=>`${ra}에서 호두과자 먹고 갈래요?`},
  charge:{e:'⚡',label:'충전',stay:25,msg:(ra,c)=>`배터리가 ${c.battery}%예요. ${ra}에서 충전하고 가도 될까요?`},
  fuel:{e:'⛽',label:'주유',stay:10,msg:(ra)=>`기름 넣어야 해요. ${ra} 들를까요?`}
};
const CONG={x0:2140,x1:2345,slow:.35};
const UPM=27.8;            // 지도 단위 / 분 (시속 100km)
const RATE=30;             // 시뮬레이션 배속
const V=UPM/60*RATE;       // 지도 단위 / 실제 초
const KM=.06;
const SIM0=9*3600+40*60;

/* ================= geometry ================= */
function mk(pts){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));return {pts,cum,len:cum[cum.length-1]};}
function at(r,d){
  d=Math.max(0,Math.min(r.len,d));let i=1;while(i<r.pts.length-1&&r.cum[i]<d)i++;
  const a=r.pts[i-1],b=r.pts[i],seg=r.cum[i]-r.cum[i-1]||1,t=(d-r.cum[i-1])/seg;
  return {x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,ang:Math.atan2(b.y-a.y,b.x-a.x)};
}
function project(r,x,y){
  let best=Infinity,bd=0;
  for(let i=1;i<r.pts.length;i++){const a=r.pts[i-1],b=r.pts[i],dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy||1;let t=((x-a.x)*dx+(y-a.y)*dy)/L;t=Math.max(0,Math.min(1,t));const px=a.x+dx*t,py=a.y+dy*t,dd=(px-x)**2+(py-y)**2;if(dd<best){best=dd;bd=r.cum[i-1]+Math.sqrt(L)*t;}}
  return bd;
}
const sOf=(r,tag)=>{const i=r.pts.findIndex(p=>p.tag===tag);return i<0?null:r.cum[i];};
function mainPts(plan){
  const ra=id=>{const R=RA[id];return [P(R.ent[0],R.ent[1],'ent:'+id),...(plan.stops.includes(id)?[P(R.x,R.y,'ra:'+id)]:[]),P(R.ext[0],R.ext[1],'ext:'+id)];};
  const pts=[P(520,600,'jc:신갈JC'),P(700,628),...ra('dp'),P(1150,618,'jc:호법JC'),...ra('yj'),P(1650,555,'jc:여주JC')];
  if(plan.alt)pts.push(P(1760,622),P(2000,644,'town:문막읍'),P(2230,566));
  else pts.push(P(1850,520),...ra('mm'));
  pts.push(P(2350,440,'jc:만종JC'),...ra('hs'),P(3000,360),P(3450,300,'pass:대관령'),P(3800,340,'dest'));
  return pts;
}
const build=(id,plan)=>mk([...PRE[id],...mainPts(plan)]);
const inCong=(x,y,alt)=>!alt&&x>CONG.x0&&x<CONG.x1&&y<505;

/* ================= state ================= */
let S;
function fresh(){
  const plan={v:1,stops:[],alt:false,stay:{}};
  const cars={};
  IDS.forEach(id=>{const r=build(id,plan),d=START_D[id],p=at(r,d);
    cars[id]={id,alias:CAR[id].alias,r,d,state:'drive',rest:0,online:true,battery:id==='A'?34:null,fuel:id==='B'?58:null,
      sx:p.x,sy:p.y,sang:p.ang,seen:Date.now(),drain:0};});
  return {view:'A',sim:0,speed:1,auto:true,plan,cars,prop:null,reacts:[],log:[],ended:false,endedAt:null,
    ui:{sheet:null,chat:false,reason:'toilet',seen:{},toast:null,fit:false,zoom:.9,nudgeOff:false,flash:null,routeAnim:0},
    cam:null,uid:1,sentOnce:false,changes:0};
}
const C=id=>S.cars[id];
const col=id=>CAR[id].color;
const nm=id=>C(id).alias;
const iga=id=>{const w=nm(id),ch=w.charCodeAt(w.length-1);return w+((ch>=0xAC00&&ch<=0xD7A3&&(ch-0xAC00)%28===0)?'가':'이');};
const pad=n=>String(n).padStart(2,'0');
const clock=extra=>{let t=SIM0+S.sim+(extra||0);t=((Math.round(t)%86400)+86400)%86400;return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60));};
function log(m){S.log.unshift({t:clock(),m});if(S.log.length>80)S.log.pop();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function face(id,size){
  size=size||40;
  return `<svg width="${size*.72}" height="${size*.5}" viewBox="0 0 36 25" aria-hidden="true"><rect x="1" y="3" width="34" height="19" rx="8" fill="#fff" opacity=".9"/><circle cx="12" cy="11" r="2.6" fill="#3A3352"/><circle cx="24" cy="11" r="2.6" fill="#3A3352"/><path d="M15 16q3 2.6 6 0" stroke="#3A3352" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="7" cy="15" r="2" fill="#FF9AA8" opacity=".7"/><circle cx="29" cy="15" r="2" fill="#FF9AA8" opacity=".7"/></svg>`;
}
function carSvg(id){
  const c=col(id);
  return `<svg class="body" viewBox="0 0 60 40" aria-hidden="true">
    <rect x="9" y="3" width="10" height="6" rx="2.5" fill="#3A3352"/><rect x="40" y="3" width="10" height="6" rx="2.5" fill="#3A3352"/>
    <rect x="9" y="31" width="10" height="6" rx="2.5" fill="#3A3352"/><rect x="40" y="31" width="10" height="6" rx="2.5" fill="#3A3352"/>
    <rect x="3" y="6" width="54" height="28" rx="13" fill="${c}" stroke="#fff" stroke-width="3"/>
    <rect x="12" y="11" width="22" height="18" rx="7" fill="#fff" opacity=".55"/>
    <circle cx="45" cy="15" r="2.6" fill="#3A3352"/><circle cx="45" cy="25" r="2.6" fill="#3A3352"/>
    <circle cx="50" cy="12" r="1.8" fill="#FF9AA8"/><circle cx="50" cy="28" r="1.8" fill="#FF9AA8"/>
  </svg>`;
}

/* ================= domain ================= */
const members=()=>IDS;
function etaMin(id){
  const c=C(id),r=c.r;let rem=r.len-c.d,mins=rem/UPM;
  // 정체 구간
  if(!S.plan.alt){const a=sOf(r,'ext:mm')||0,b=sOf(r,'jc:만종JC');if(b!=null&&c.d<b){const z=Math.max(0,b-Math.max(c.d,a+40));mins+=z/UPM*(1/CONG.slow-1);}}
  S.plan.stops.forEach(s=>{const sd=sOf(r,'ra:'+s);if(sd!=null&&c.d<sd-1)mins+=S.plan.stay[s]||10;});
  if(c.state==='rest')mins+=Math.max(0,(S.plan.stay[c.at]||10)-c.rest*RATE/60);
  return Math.max(0,mins);
}
function minsTo(id,tag){const c=C(id),s=sOf(c.r,tag);if(s==null)return null;return (s-c.d)/UPM;}
function raAvail(ra,reason){
  if(S.plan.stops.includes(ra))return {ok:false,why:'이미 들르기로 했어요'};
  for(const id of IDS){const m=minsTo(id,'ent:'+ra);if(m==null)return {ok:false,why:'바뀐 경로에는 없어요'};if(m<1.5)return {ok:false,why:`${iga(id)} 이미 지나쳤어요`};}
  if(reason&&!RA[ra].fac[reason])return {ok:false,why:reason==='charge'?'충전기 운영 정보가 없어요':'시설이 없어요'};
  return {ok:true};
}
function altAvail(){
  if(S.plan.alt)return {ok:false,why:'이미 국도로 돌아가고 있어요'};
  for(const id of IDS){const m=minsTo(id,'jc:여주JC');if(m==null||m<1.5)return {ok:false,why:'여주JC를 지난 차가 있어요'};}
  return {ok:true};
}
function altSaving(){
  // 대략: 정체 손실 - 우회 추가 거리
  const base=build('A',S.plan),alt=build('A',Object.assign({},S.plan,{alt:true}));
  const a=sOf(base,'ext:mm'),b=sOf(base,'jc:만종JC');
  const cong=(b-(a+40))/UPM*(1/CONG.slow-1);
  const extra=(alt.len-base.len)/UPM;
  return Math.round(cong-extra);
}
function nextRA(reason){return RA_ORDER.find(r=>raAvail(r,reason).ok)||null;}

function send(from,kind,ra,reason){
  if(S.prop||S.ended)return;
  const votes={};IDS.forEach(i=>votes[i]=null);votes[from]='yes';
  let text;
  if(kind==='stop')text=REASON[reason].msg(RA[ra].name,C(from));
  else text=`만종JC 앞이 막힌대요! 국도 42호선으로 돌아가면 약 ${altSaving()}분 빨라요. 같이 갈까요?`;
  S.prop={id:S.uid++,from,kind,ra,reason,votes,status:'open',t:Date.now(),text,at:clock()};
  S.sentOnce=true;
  log(`${nm(from)} → 그룹: ${kind==='stop'?RA[ra].name+' '+REASON[reason].label:'국도 우회'} 제안`);
  if(from!==S.view){S.ui.toast={t:`${iga(from)} 물어봤어요`,s:'차 옆 말풍선을 눌러 대답해 주세요',until:Date.now()+4000,open:true};}
  S.ui.sheet=null; S.ui.chat=false;
  ui();
}
function vote(id,ans){
  const p=S.prop;if(!p||p.status!=='open'||p.votes[id])return;
  p.votes[id]=ans;
  react(id,ans==='yes'?'좋아요! 👍':'다음에 해요 🙏');
  log(`${nm(id)} ${ans==='yes'?'좋아요':'다음에'}`);
  if(ans==='no'){p.status='no';p.done=Date.now();
    S.ui.toast={t:`${iga(id)} 다음에 하재요`,s:'경로는 그대로예요. 다른 곳을 다시 물어볼 수 있어요.',until:Date.now()+3500};
    log(`제안 무산 · 경로 유지 (v${S.plan.v})`);}
  else if(IDS.every(i=>p.votes[i]==='yes'))apply();
  ui();
}
function apply(){
  const p=S.prop;p.status='ok';p.done=Date.now();
  const before=etaMin(S.view);
  const np={v:S.plan.v+1,stops:[...S.plan.stops],alt:S.plan.alt,stay:Object.assign({},S.plan.stay)};
  if(p.kind==='stop'){np.stops.push(p.ra);np.stay[p.ra]=REASON[p.reason].stay;}else np.alt=true;
  IDS.forEach(id=>{const c=C(id),pos=at(c.r,c.d);c.r=build(id,np);c.d=project(c.r,pos.x,pos.y);});
  S.plan=np;S.changes++;
  const after=etaMin(S.view),diff=Math.round(after-before);
  S.ui.routeAnim=Date.now();S.ui.lastDiff={v:diff,until:Date.now()+15000};
  S.ui.toast={t:p.kind==='stop'?`다 같이 ${RA[p.ra].name} 들러요!`:'다 같이 국도로 돌아가요!',s:`경로를 바꿨어요 · 도착 ${diff>=0?'+':''}${diff}분 (계획 v${np.v})`,until:Date.now()+6500};
  log(`모두 동의 → 계획 v${np.v} · 모든 차량 내비 경로 갱신`);
  drawRoute(true);
}
function react(id,text,ms){S.reacts=S.reacts.filter(r=>r.id!==id);S.reacts.push({id,text,until:Date.now()+(ms||2600)});}

/* ================= actions ================= */
function act(a,arg){
  const v=S.view;
  switch(a){
    case 'view': S.view=arg;S.ui.sheet=null;S.ui.chat=false;S.cam=null;drawRoute(false);break;
    case 'sheet': S.ui.sheet=arg;S.ui.chat=false;if(arg==='stop'&&!S.ui.reasonSet)S.ui.reason=CAR[v].kind==='ev'&&C(v).battery<=25?'charge':'toilet';break;
    case 'close': S.ui.sheet=null;S.ui.chat=false;break;
    case 'reason': S.ui.reason=arg;S.ui.reasonSet=true;break;
    case 'ask-stop': send(v,'stop',arg,S.ui.reason);break;
    case 'ask-alt': send(v,'alt');break;
    case 'chat': S.ui.chat=true;S.ui.sheet=null;if(S.prop)S.ui.seen[S.prop.id]=true;S.ui.toast=null;break;
    case 'yes': vote(v,'yes');return;
    case 'no': vote(v,'no');return;
    case 'cancel-prop': if(S.prop&&S.prop.from===v){log(`${nm(v)} 제안 취소`);S.prop=null;S.ui.chat=false;}break;
    case 'go-on': {const c=C(v);c.state='drive';react(v,'출발! 🚗');log(`${nm(v)} 출발 준비 완료 · 다시 출발`);break;}
    case 'fit': S.ui.fit=!S.ui.fit;break;
    case 'zin': S.ui.fit=false;S.ui.zoom=Math.min(1.5,S.ui.zoom+.15);break;
    case 'zout': S.ui.fit=false;S.ui.zoom=Math.max(.35,S.ui.zoom-.15);break;
    case 'nudge-yes': S.ui.reason='charge';S.ui.reasonSet=true;S.ui.sheet='stop';break;
    case 'nudge-no': S.ui.nudgeOff=C('A').battery;break;
    case 'end': S.ended=true;S.ui.sheet=null;S.ui.chat=false;log('그룹 종료 · 모든 차량 위치 공유 중단');break;
    case 'toast': if(S.ui.toast&&S.ui.toast.open&&S.prop){S.ui.chat=true;S.ui.seen[S.prop.id]=true;}S.ui.toast=null;break;
    /* console */
    case 'sim-B-toilet': send('B','stop',nextRA('toilet'),'toilet');return;
    case 'sim-C-snack': send('C','stop',nextRA('snack'),'snack');return;
    case 'sim-C-alt': send('C','alt');return;
    case 'sim-A-bat': C('A').battery=22;S.ui.nudgeOff=false;log('우리집 배터리 22% (Vehicle SDK 값 변경)');break;
    case 'speed': S.speed=+arg;break;
    case 'auto': S.auto=!S.auto;break;
    case 'net': {const c=C(arg);c.online=!c.online;log(`${nm(arg)} ${c.online?'다시 연결 · 최신 경로 v'+S.plan.v+' 받음':'연결 끊김 · 마지막 위치로 표시'}`);break;}
    case 'reset': S=fresh();drawRoute(false);break;
  }
  ui();
}

/* ================= route drawing ================= */
function drawRoute(anim){
  const r=C(S.view).r;
  const d='M'+r.pts.map(p=>p.x+' '+p.y).join(' L');

/* ================= UI ================= */
function nextEvent(id){
  const c=C(id),r=c.r;
  for(let i=0;i<r.pts.length;i++){const p=r.pts[i];if(!p.tag||r.cum[i]<=c.d+1)continue;
    const [k,name]=p.tag.split(':');
    if(k==='jc'){const alt=S.plan.alt&&name==='여주JC';return {icon:alt?'↘️':'⬆️',what:alt?'여주JC에서 국도 42호선 방면':`${name} · 강릉 방향 유지`,s:r.cum[i]};}
    if(k==='ra')return {icon:'☕',what:`${RA[name].name} 진입 · 같이 쉬어요`,s:r.cum[i]};
    if(k==='pass')return {icon:'⛰️',what:`${name} 지나서 강릉으로`,s:r.cum[i]};
    if(k==='town')continue;
    if(k==='dest')return {icon:'🏡',what:`목적지 ${DEST}`,s:r.cum[i]};
  }
  return null;
}
function km(u){const k=u*KM;return k<1?Math.round(k*1000)+'m':k.toFixed(k<10?1:0)+'km';}
function rel(id){
  if(id===S.view)return '나';
  const me=C(S.view),o=C(id);
  const md=project(me.r,o.sx,o.sy)-me.d;
  if(Math.abs(md)<12)return '바로 옆';
  return `${km(Math.abs(md))} ${md>0?'앞':'뒤'}`;
}
function statusOf(id){
  const c=C(id);
  if(!c.online)return '연결 끊김';
  if(c.state==='rest')return '휴게소에서 쉬는 중 ☕';
  if(c.state==='arrived')return '도착!';
  if(inCong(c.sx,c.sy,S.plan.alt))return '정체 구간 지나는 중';
  return `달리는 중 · ${rel(id)}`;
}
function energy(id){
  const c=C(id);
  if(CAR[id].kind==='ev')return `<span title="배터리">⚡${c.battery}%</span>`;
  if(CAR[id].kind==='gas')return `<span title="연료">⛽${c.fuel}%</span>`;
  return '<span title="에너지 정보 미지원" style="opacity:.6">⛽ 정보 없음</span>';
}
function bubbleFor(id){
  const v=S.view,p=S.prop,c=C(id);
  const rc=S.reacts.find(r=>r.id===id&&r.until>Date.now());
  if(rc)return `<button class="bub pop" data-act="${p&&p.status==='open'?'chat':''}">${rc.text}</button>`;
  if(p&&p.status==='open'&&p.from===id){
    const icon=p.kind==='stop'?REASON[p.reason].e:'🛣️';
    if(id!==v&&!p.votes[v])return `<button class="bub q pop" data-act="chat" aria-label="${nm(id)}의 질문 보기"><span class="why">${icon}</span>?${S.ui.seen[p.id]?'':'<span class="one">1</span>'}</button>`;
    const n=IDS.filter(i=>p.votes[i]==='yes').length;
    return `<button class="bub mine" data-act="chat">${icon} ${n}/${IDS.length} 좋아요</button>`;
  }
  if(c.state==='rest')return `<span class="bub rest">쉬는 중 ☕</span>`;
  if(!c.online)return `<span class="bub">📡 연결 중…</span>`;
  return '';
}
function carsHTML(){
  const v=S.view;
  return [...IDS.filter(i=>i!==v),v].map(id=>{const c=C(id);
    return `<div class="car ${id===v?'me':''} ${c.online||id===v?'':'off'}" data-car="${id}" style="--c:${col(id)}">
      ${id===v?'<div class="ring"></div>':''}<div class="rot">${carSvg(id)}</div>

}

    <div class="msg ${mine?'me':''}">${mine?'':`<span class="face" style="--c:${col(p.from)}">${face(p.from)}</span>`}

  const p=S.prop,v=S.view,c=C(v);
  if(S.ended)return '그룹이 끝나 위치 공유가 멈췄어요. ‘처음부터’로 다시 시연할 수 있어요.';
  if(c.state==='arrived')return '도착했어요! 화면의 ‘그룹 끝내기’를 누르면 공유가 멈춰요.';
  if(c.state==='rest')return '휴게소에 도착했어요. ‘출발 준비 완료!’를 누르면 다시 출발해요. 다른 차들은 각자 준비되면 출발해요.';

/* ================= loop ================= */
function step(dt){
  S.sim+=dt*RATE;
  IDS.forEach(id=>{
    const c=C(id);
    if(c.state==='drive'){
      const p0=at(c.r,c.d);
      let nd=c.d+V*dt*(inCong(p0.x,p0.y,S.plan.alt)?CONG.slow:1);
      for(const s of S.plan.stops){const sd=sOf(c.r,'ra:'+s);if(sd!=null&&c.d<sd&&nd>=sd){nd=sd;c.state='rest';c.at=s;c.rest=0;react(id,'도착! ☕',3000);log(`${nm(id)} ${RA[s].name} 도착`);dirty=true;break;}}
      if(nd>=c.r.len){nd=c.r.len;c.state='arrived';react(id,'도착! 🎉',3500);log(`${nm(id)} ${DEST} 도착`);dirty=true;}
      c.d=nd;
      if(id==='A'){c.drain+=dt;if(c.drain>=8){c.drain=0;if(c.battery>5){c.battery--;if(c.battery===25)dirty=true;}}}
    }else if(c.state==='rest'){
      c.rest+=dt;
      if(id!==S.view&&c.rest>5){c.state='drive';react(id,'출발! 🚗');log(`${nm(id)} 출발 준비 완료 · 다시 출발`);dirty=true;}
    }
    if(c.online){const p=at(c.r,c.d);c.sx=p.x;c.sy=p.y;c.sang=p.ang;}
  });
}
let dirty=false,last=performance.now();
function place(){
  const map=document.getElementById('map'),W=1280,H=600,v=S.view,me=C(v),mp=at(me.r,me.d);
  let tx,ty,ts;
  if(S.ui.fit){
    const xs=IDS.map(i=>i===v?mp.x:C(i).sx),ys=IDS.map(i=>i===v?mp.y:C(i).sy);
    S.plan.stops.forEach(s=>{const sd=sOf(me.r,'ra:'+s);if(sd!=null&&sd>me.d){xs.push(RA[s].x);ys.push(RA[s].y);}});
    const ne=nextEvent(v);if(ne){const q=at(me.r,ne.s);xs.push(q.x);ys.push(q.y);}
    const x0=Math.min(...xs)-160,x1=Math.max(...xs)+160,y0=Math.min(...ys)-170,y1=Math.max(...ys)+170;
    ts=Math.max(.3,Math.min(.75,Math.min(W/(x1-x0),(H-120)/(y1-y0))));tx=(x0+x1)/2;ty=(y0+y1)/2+40/ts;
  }else{ts=S.ui.zoom;tx=mp.x+W*.12/ts;ty=mp.y+20/ts;}
  if(!S.cam)S.cam={x:tx,y:ty,s:ts};
  const k=.12;S.cam.x+=(tx-S.cam.x)*k;S.cam.y+=(ty-S.cam.y)*k;S.cam.s+=(ts-S.cam.s)*k;
  const cam=S.cam;
  document.getElementById('cam').setAttribute('transform',`translate(${(W/2-cam.x*cam.s).toFixed(1)} ${(H/2-cam.y*cam.s).toFixed(1)}) scale(${cam.s.toFixed(4)})`);
  document.querySelectorAll('[data-car]').forEach(e=>{
    const id=e.dataset.car,c=C(id);
    const p=id===v?mp:{x:c.sx,y:c.sy,ang:c.sang};
    const sx=(p.x-cam.x)*cam.s+W/2,sy=(p.y-cam.y)*cam.s+H/2;
    e.style.transform=`translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px)`;
    const r=e.querySelector('.rot');if(r)r.style.transform=`rotate(${p.ang}rad)`;
  });
  const done=document.getElementById('done');if(done)done.setAttribute('stroke-dasharray',`${me.d.toFixed(1)} 999999`);
}
function live(){
  const v=S.view,c=C(v);
  const q=(sel,t)=>{const e=document.querySelector(`[data-live="${sel}"]`);if(e&&e.textContent!==t)e.textContent=t;};
  q('clock',clock());
  q('eta',`${clock(etaMin(v)*60)} 도착`);
  q('rem',`${km(c.r.len-c.d)} · ${Math.round(etaMin(v))}분 남음 · ${DEST}`);
  const ev=nextEvent(v);if(ev)q('tdist',km(ev.s-c.d));
  IDS.forEach(id=>q('st-'+id,statusOf(id)));
}
const nodeState={};
function periodic(){
  const now=Date.now(),p=S.prop;
  // 자동 대답
  if(p&&p.status==='open'&&S.auto){
    IDS.forEach((id,i)=>{if(id===S.view||p.votes[id]||!C(id).online)return;if(now-p.t>1600+i*900)vote(id,'yes');});
  }
  if(p&&p.status!=='open'&&now-p.done>2800){S.prop=null;S.ui.chat=false;dirty=true;}
  // 지나간 반응/토스트 정리
  const before=S.reacts.length;S.reacts=S.reacts.filter(r=>r.until>now);if(S.reacts.length!==before)dirty=true;
  if(S.ui.toast&&S.ui.toast.until<=now){S.ui.toast=null;dirty=true;}
  if(S.ui.lastDiff&&S.ui.lastDiff.until<=now){S.ui.lastDiff=null;dirty=true;}
  const ev=nextEvent(S.view),key=(ev?ev.what:'')+C(S.view).state;
  if(nodeState.k!==key){nodeState.k=key;dirty=true;}
  if(S.ui.routeAnim&&now-S.ui.routeAnim>1400){S.ui.routeAnim=0;drawRoute(false);}
}
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000)*S.speed;last=ts;
  if(!S.ended)step(dt);
  if(!frame.t||ts-frame.t>250){frame.t=ts;periodic();if(dirty){dirty=false;ui();}else live();}
  place();
  requestAnimationFrame(frame);
}

/* ================= events ================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act;if(!a)return;act(a,t.dataset.arg);});
function fit(){const st=document.getElementById('stage');const s=Math.max(.5,Math.min(1,st.clientWidth/1304));document.documentElement.style.setProperty('--s',s.toFixed(4));}
new ResizeObserver(fit).observe(document.getElementById('stage'));
document.querySelectorAll('[data-face]').forEach(e=>e.innerHTML=face(e.dataset.face,32));

S=fresh();
document.getElementById('static').innerHTML=staticMap();
drawRoute(false);fit();ui();requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
