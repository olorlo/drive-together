<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이 가요 시연</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 왼쪽 차량 화면(1280x720 고정, 비율 유지 축소) + 오른쪽 시연 콘솔 */
:root{
  --bg:#F2F4F5; --panel:#FFFFFF; --ink:#1B2430; --muted:#5B6673; --line:#E2E6EA; --soft:#F1F3F5;
  --accent:#087F70; --accent-ink:#FFFFFF; --accent-soft:rgba(8,127,112,.10);
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --num:Inter,"Noto Sans KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1419; --panel:#1A2128; --ink:#E9EEF2; --muted:#A3AEB9; --line:#2C353F; --soft:#222A33;
    --accent:#3CC4B0; --accent-ink:#0F1419; --accent-soft:rgba(60,196,176,.14); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1419; --panel:#1A2128; --ink:#E9EEF2; --muted:#A3AEB9; --line:#2C353F; --soft:#222A33;
  --accent:#3CC4B0; --accent-ink:#0F1419; --accent-soft:rgba(60,196,176,.14); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid #3CC4B0;outline-offset:2px}

.page{max-width:1780px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.viewer{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.viewer .lbl{font-size:13px;color:var(--muted);margin-right:2px}
.vbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 14px 6px 6px;font-size:15px;font-weight:500}
.vbtn small{color:var(--muted);font-size:12px;font-weight:400}
.vbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.vdot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.frame{width:calc(1304px * var(--s,1));height:calc(744px * var(--s,1))}
.bezel{width:1304px;height:744px;padding:12px;border-radius:30px;background:#11161B;transform:scale(var(--s,1));transform-origin:0 0;box-shadow:0 24px 50px -30px rgba(10,20,30,.55)}
.foot{font-size:12.5px;color:var(--muted);margin:10px 2px 0;max-width:100ch}
.foot b{font-weight:500;color:var(--ink)}

/* ================= 차량 화면 (항상 주간 차량 UI) ================= */
.screen{--p:#087F70;--pl:#3CC4B0;--acc:#FFC845;--ink:#1B2430;--muted:#5B6673;--line:#E2E6EA;--soft:#F1F3F5;--surf:#FFFFFF;
  width:1280px;height:720px;border-radius:20px;overflow:hidden;position:relative;background:#EEF1F0;color:var(--ink);font-family:var(--font);color-scheme:light}
.sbar{position:absolute;inset:0 0 auto 0;height:44px;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);font-size:15px}
.sbar .l,.sbar .r{display:flex;gap:14px;align-items:center;min-width:300px}
.sbar .r{justify-content:flex-end}
.sbar .mid{display:flex;align-items:center;gap:8px;font-weight:700}
.sbar .mid small{font-weight:400;color:var(--muted);font-size:13px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 9px;background:var(--soft);font-size:13px;font-weight:500}
.ndot{width:7px;height:7px;border-radius:50%;background:#1F9D6B;display:inline-block}
.ndot.bad{background:#D64545}

.map{position:absolute;inset:44px 0 0 0;overflow:hidden}
#gl{position:absolute;inset:0;opacity:0;transition:opacity .4s}
#gl.on{opacity:1}
#illu{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none}
.ov > *{position:absolute;left:0;top:0;will-change:transform}
.city{font-size:13px;font-weight:500;color:#7B8792;white-space:nowrap;transform-origin:0 0;text-shadow:0 0 3px #EEF1F0,0 0 3px #EEF1F0}
.city.big{font-size:16px;font-weight:700;color:#5E6B77}
.pin{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:500;white-space:nowrap;box-shadow:0 2px 6px rgba(15,23,32,.12)}
.pin i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(8,127,112,.1)}
.pin.on{background:var(--p);color:#fff;border-color:var(--p)}
.pin.on i{background:rgba(255,255,255,.2)}
.pin.dest i{background:#1B2430}
.car{width:0;height:0}
.car .rot{position:absolute;left:-23px;top:-15px;width:46px;height:30px}
.car .halo{position:absolute;left:-30px;top:-30px;width:60px;height:60px;border-radius:50%;background:rgba(8,127,112,.16);animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
.car .tag{position:absolute;top:20px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1.5px solid var(--c);border-radius:999px;padding:0 9px;font-size:12.5px;font-weight:500;line-height:21px;box-shadow:0 2px 6px rgba(15,23,32,.12)}
.car.me .tag{background:var(--c);color:#fff;font-weight:700}
.car.off{opacity:.5}
.car.off .tag{border-style:dashed}
.bub{position:absolute;left:16px;bottom:16px;pointer-events:auto;border:0;white-space:nowrap;border-radius:12px 12px 12px 4px;padding:6px 12px;font-size:14px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(15,23,32,.18);display:flex;align-items:center;gap:6px}
.bub.q{background:var(--acc);animation:bob 1.3s ease-in-out infinite}
.bub.q .one{min-width:20px;height:20px;border-radius:10px;background:#1B2430;color:#fff;font-size:12px;line-height:20px;text-align:center;padding:0 5px}
.bub.ok{background:#E3F4F1;color:#065E53}
.bub.rest{background:#fff;color:var(--muted);font-weight:500}
.pop{animation:popin .32s cubic-bezier(.3,1.5,.6,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* overlays */
.ui{position:absolute;inset:0;pointer-events:none}
.ui > *{pointer-events:auto}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 24px -16px rgba(15,23,32,.45)}
.turn{position:absolute;top:16px;left:16px;width:340px;display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--p);color:#fff;box-shadow:0 10px 22px -12px rgba(8,127,112,.7)}
.turn .ar{width:60px;height:60px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none}
.turn .d{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.turn .w{font-size:15px;font-weight:500;opacity:.95}
.turn.rest{background:#fff;color:var(--ink);border:1px solid var(--line)}
.turn.rest .ar{background:var(--soft)}
.grp{position:absolute;top:16px;right:16px;width:300px;padding:12px 16px 6px}
.grp h4{margin:0 0 4px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.grp h4 small{font-size:12px;color:var(--muted);font-weight:400}
.gr{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.gr .nm{font-size:14.5px;font-weight:500;line-height:1.2}
.gr .st{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-size:12.5px;font-weight:500;color:var(--muted)}
.qbtn{border:0;border-radius:8px;padding:3px 9px;background:var(--acc);font-size:12px;font-weight:700}
.bar{position:absolute;left:16px;right:16px;bottom:16px;height:88px;display:flex;align-items:center;gap:12px;padding:0 14px 0 24px}
.eta b{font-family:var(--num);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.eta b span{font-family:var(--font);font-size:17px;font-weight:500}
.eta small{display:block;font-size:13.5px;color:var(--muted);margin-top:3px}
.eta .chg{font-size:13px;font-weight:700;color:var(--p);margin-left:8px}
.sp{flex:1}
.kb{height:60px;border:0;border-radius:12px;padding:0 20px;font-size:17px;font-weight:700;background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.kb.t{background:rgba(8,127,112,.10);color:var(--p)}
.kb.p{background:var(--p);color:#fff}
.kb.y{background:var(--acc);color:var(--ink)}
.kb.o{background:#fff;border:1px solid var(--line);font-weight:500}
.kb:disabled{opacity:.4}
.kb.sm{height:46px;font-size:15px;padding:0 14px}
.zoom{position:absolute;right:16px;bottom:120px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:#fff;font-family:var(--num);font-size:22px;font-weight:600;box-shadow:0 6px 14px -10px rgba(15,23,32,.5)}
.zoom button[aria-pressed="true"]{background:var(--p);color:#fff;border-color:var(--p)}
.zoom .fit{font-family:var(--font);font-size:14px}
.toast{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:30;border:0;background:#1B2430;color:#fff;border-radius:14px;padding:11px 22px;font-size:17px;font-weight:700;text-align:center;box-shadow:0 12px 26px -12px rgba(0,0,0,.5);animation:drop .4s cubic-bezier(.3,1.4,.6,1);max-width:560px}
.toast small{display:block;font-size:13px;font-weight:400;opacity:.85}
@keyframes drop{from{transform:translate(-50%,-24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.nudge{position:absolute;left:16px;bottom:118px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;font-size:16px;font-weight:500}
.mini{position:absolute;left:16px;bottom:118px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 8px;font-size:14px}
.mini .art{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#087F70,#3CC4B0);display:grid;place-items:center}
.mini .t{font-weight:700;line-height:1.2}
.mini .s{font-size:12px;color:var(--muted)}
.mini .prog{width:120px;height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.mini .prog i{display:block;height:100%;background:var(--p)}
.avs{display:flex}
.avs .av{width:24px;height:24px;border-radius:7px;font-size:11px;border:2px solid #fff;margin-left:-6px}
.avs .av:first-child{margin-left:0}

/* 질문 카드 */
.ask{position:absolute;top:16px;right:332px;width:420px;padding:16px;z-index:20;display:flex;flex-direction:column;gap:12px;animation:popin .28s cubic-bezier(.3,1.3,.6,1);transform-origin:100% 0}
.ask .hd{display:flex;align-items:center;gap:10px}
.ask .hd b{flex:1;font-size:14.5px}
.ask .hd .x{width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);display:grid;place-items:center}
.ask p{margin:0;font-size:18px;line-height:1.5;font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted)}
.votes{display:flex;flex-wrap:wrap;gap:6px}
.vt{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px 3px 3px;background:var(--soft);font-size:12.5px;font-weight:500}
.vt .av{width:22px;height:22px;border-radius:6px;font-size:10.5px}
.vt.wait{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.acts{display:flex;gap:8px}
.acts .kb{flex:1;height:56px}
.done{border-radius:12px;background:#E3F4F1;color:#065E53;padding:10px 14px;font-size:14.5px;font-weight:700;text-align:center}
.done.no{background:var(--soft);color:var(--muted)}
.voice{font-size:12.5px;color:var(--muted);text-align:center}

/* 시트 */
.dim{position:absolute;inset:0;background:rgba(15,23,32,.28);z-index:24}
.sheet{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:820px;padding:20px 22px;z-index:25;border-radius:20px;background:#fff;animation:up .32s cubic-bezier(.3,1.2,.6,1)}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.sheet h3{margin:0;font-size:22px;display:flex;justify-content:space-between;align-items:center}
.sheet .s{margin:2px 0 14px;color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:16px;font-weight:500;display:flex;gap:6px;align-items:center}
.chips button[aria-pressed="true"]{border-color:var(--p);background:rgba(8,127,112,.08);color:var(--p);font-weight:700}
.chips button:disabled{opacity:.35}
.opt{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:14px;border:1px solid var(--line);padding:12px 14px;margin-bottom:10px}
.opt .ico{width:52px;height:52px;border-radius:12px;background:rgba(8,127,112,.1);display:grid;place-items:center}
.opt .ttl{font-size:19px;font-weight:700}
.opt .sub{font-size:13px;color:var(--muted)}
.opt .etas{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.opt .etas span{font-size:12px;background:var(--soft);border-radius:6px;padding:1px 8px 1px 4px;display:inline-flex;align-items:center;gap:5px}
.opt .etas i{width:10px;height:10px;border-radius:3px;display:inline-block}
.opt.na{opacity:.5}
.empty{color:var(--muted);font-size:15px;padding:10px 2px}
.play{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard .ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center}
.pcard h5{margin:0;font-size:18px}
.pcard p{margin:0;font-size:13.5px;color:var(--muted)}
.pcard .kb{margin-top:auto;height:52px;justify-content:center}

/* 룰렛 */
.rl{position:absolute;inset:0;z-index:26;display:grid;place-items:center;background:rgba(15,23,32,.35)}
.rlc{width:560px;padding:24px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:14px;animation:popin .3s cubic-bezier(.3,1.3,.6,1)}
.rlc.still{animation:none}
.rlc h3{margin:0;font-size:22px}
.rlc .s{margin:-8px 0 0;color:var(--muted);font-size:14px;text-align:center}
.wheel{position:relative;width:250px;height:250px}
.wheel svg{width:250px;height:250px;transition:transform 2.6s cubic-bezier(.15,.85,.2,1)}
.wheel .needle{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid #1B2430}
.res{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.res b{font-size:20px}
.res span{font-size:14px;color:var(--muted)}
.sdk{font-family:var(--num);font-size:12px;background:var(--soft);border-radius:8px;padding:6px 10px;color:#3A4652}
.pen{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:28;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 18px;border-radius:16px;background:#1B2430;color:#fff;box-shadow:0 12px 26px -12px rgba(0,0,0,.5)}
.pen b{font-size:17px}
.pen small{display:block;font-size:12.5px;opacity:.8}
.pen .kb{height:44px;font-size:14px;background:rgba(255,255,255,.14);color:#fff}

/* 로비·도착 */
.cover{position:absolute;inset:44px 0 0 0;z-index:35;display:grid;place-items:center;background:rgba(238,241,240,.72);backdrop-filter:blur(3px)}
.lob{width:640px;padding:28px 30px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 22px 50px -26px rgba(15,23,32,.55);display:flex;flex-direction:column;gap:16px}
.lob h2{margin:0;font-size:26px}
.lob .s{margin:-10px 0 0;color:var(--muted);font-size:14.5px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;color:var(--muted);font-weight:500}
.field .v{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:500;display:flex;align-items:center;gap:10px}
.code{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;background:rgba(8,127,112,.08);padding:14px 18px}
.code b{font-family:var(--num);font-size:36px;letter-spacing:.12em;color:var(--p)}
.mem{display:flex;flex-direction:column}
.mem .row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mem .row:first-child{border-top:0}
.ok{color:#087F70;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.wt{color:var(--muted);font-size:13px}
.recap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.recap div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.recap b{display:block;font-family:var(--num);font-size:22px;font-variant-numeric:tabular-nums}
.recap span{font-size:12px;color:var(--muted)}

/* ================= 콘솔 ================= */
.console{display:flex;flex-direction:column;gap:12px;min-width:0}
.cb{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.cb h3{margin:0 0 8px;font-size:15px;font-weight:700}
.cb .n{margin:-4px 0 10px;font-size:12.5px;color:var(--muted)}
.hint{border-color:var(--accent);background:var(--accent-soft)}
.hint p{margin:0;font-size:14px}
.steps{display:flex;flex-direction:column;gap:6px}
.stp{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;font-size:13.5px}
.stp i{font-style:normal;width:26px;height:26px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-family:var(--num);font-size:12px;font-weight:700;color:var(--muted)}
.stp[aria-current="step"]{border-color:var(--accent)}
.stp[aria-current="step"] i{background:var(--accent);color:var(--accent-ink)}
.stp:disabled{opacity:.45}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.row2:first-of-type{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sw{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}

  return `<svg width="46" height="30" viewBox="0 0 46 30" aria-hidden="true"><rect x="2" y="2" width="42" height="26" rx="10" fill="${c}" stroke="#fff" stroke-width="2.5"/><rect x="9" y="8" width="15" height="14" rx="5" fill="#fff" opacity=".35"/><circle cx="34" cy="11" r="2.1" fill="${eye}"/><circle cx="34" cy="19" r="2.1" fill="${eye}"/></svg>`;
}
const av=(id,cls='')=>`<span class="av ${cls}" style="background:${col(id)}">${CAR[id].short}</span>`;

/* ======================= 안내 문구 ======================= */
const SKIP=new Set(['depart','new name','continue','notification']);
const DIR={left:'좌회전',right:'우회전','slight left':'왼쪽 방향','slight right':'오른쪽 방향','sharp left':'급좌회전','sharp right':'급우회전',uturn:'유턴',straight:'직진'};
const DEG={left:-90,right:90,'slight left':-40,'slight right':40,'sharp left':-135,'sharp right':135,uturn:180,straight:0};
function instr(st){
  const side=st.m&&st.m.includes('left')?'왼쪽':'오른쪽',to=st.n?` · ${st.n}`:'';
  switch(st.t){
    case 'arrive':return '목적지 도착';
    case 'off ramp':return `${side} 출구로 나가기${to}`;
    case 'on ramp':return `${side} 진입로로 들어가기${to}`;
    case 'fork':return `${side} 길로 가기${to}`;
    case 'merge':return `합류${to}`;
    case 'roundabout':case 'rotary':return `회전교차로${to}`;
    default:return `${DIR[st.m]||'직진'}${to}`;
  }
}
function nextTurn(id){
  const c=C(id),r=RT[id];
  // 계획에 들어간 휴게소가 더 가까우면 그걸 먼저 안내
  const st=S.plan.stops.map(k=>({k,s:SSTOP[id][k]})).filter(x=>x.s>c.s+5).sort((a,b)=>a.s-b.s)[0];
  for(const step of r.steps){
    if(step.s<=c.s+5||SKIP.has(step.t))continue;
    if(st&&st.s<step.s)return {d:st.s-c.s,w:`${RA[st.k].name} 진입 · 같이 쉬어요`,deg:40,stop:true};
    return {d:step.s-c.s,w:instr(step),deg:step.t==='arrive'?0:(DEG[step.m]??0)};
  }
  if(st)return {d:st.s-c.s,w:`${RA[st.k].name} 진입 · 같이 쉬어요`,deg:40,stop:true};
  return null;
}

/* ======================= 도메인 ======================= */
function remainSec(id){
  const c=C(id),r=RT[id];let sec=(r.len-c.s)/r.v;
  S.plan.stops.forEach(k=>{if(SSTOP[id][k]>c.s+5)sec+=(S.plan.stay[k]||10)*60;});
  if(c.state==='rest')sec+=Math.max(0,c.rest);
  return sec;
}
function secTo(id,k){const c=C(id);return (SSTOP[id][k]-c.s)/RT[id].v;}
function raAvail(k,reason){
  if(S.plan.stops.includes(k))return {ok:false,why:'이미 들르기로 했어요'};
  for(const id of IDS){if(secTo(id,k)<90)return {ok:false,why:`${iga(id)} 이미 지나쳤어요`};}
  if(reason&&!RA[k].fac[reason])return {ok:false,why:'시설이 없어요'};
  return {ok:true};
}
function nextRA(reason){return RA_ORDER.find(k=>raAvail(k,reason).ok)||null;}
function react(id,text,ms,cls){S.reacts=S.reacts.filter(r=>r.id!==id);S.reacts.push({id,text,cls:cls||'ok',until:Date.now()+(ms||2600)});}
function toast(t,s,ms,open){S.ui.toast={t,s,until:Date.now()+(ms||4000),open:!!open};}

function send(from,ra,reason){
  if(S.prop||S.phase!=='drive')return;
  const votes={};IDS.forEach(i=>votes[i]=null);votes[from]='yes';
  S.prop={id:S.uid++,from,ra,reason,votes,status:'open',t:Date.now(),text:REASON[reason].msg(RA[ra].name,C(from)),at:clock()};
  log('srv',`${nm(from)} → 그룹: ${RA[ra].name} ${REASON[reason].label} 제안`);
  if(from!==S.view)toast(`${iga(from)} 물어봤어요`,'차 옆 말풍선을 눌러 대답해 주세요',4200,true);
  S.ui.sheet=null;S.ui.ask=from===S.view;
}
function vote(id,ans){
  const p=S.prop;if(!p||p.status!=='open'||p.votes[id])return;
  p.votes[id]=ans;react(id,ans==='yes'?'좋아요':'다음에 해요',2400,ans==='yes'?'ok':'rest');
  log('srv',`${nm(id)} ${ans==='yes'?'좋아요':'다음에'}`);
  if(ans==='no'){p.status='no';p.done=Date.now();toast(`${iga(id)} 다음에 하재요`,'경로는 그대로예요',3500);log('srv',`제안 무산 · 계획 v${S.plan.v} 유지`);}
  else if(IDS.every(i=>p.votes[i]==='yes'))apply();
}
function apply(){
  const p=S.prop;p.status='ok';p.done=Date.now();
  const before=remainSec(S.view);
  S.plan={v:S.plan.v+1,stops:[...S.plan.stops,p.ra],stay:{...S.plan.stay,[p.ra]:REASON[p.reason].stay}};
  S.stats.stops++;
  const diff=Math.round((remainSec(S.view)-before)/60);
  S.ui.lastDiff={v:diff,until:Date.now()+15000};
  toast(`다 같이 ${RA[p.ra].name}에 들러요`,`모든 차 경로 변경 · 도착 ${diff>=0?'+':''}${diff}분 · 계획 v${S.plan.v}`,6000);
  log('srv',`모두 동의 → 계획 v${S.plan.v} 배포 (경유지 ${RA[p.ra].name})`);
  MAP.flash();
}

/* ======================= 함께 놀기 ======================= */
const SONG={title:'가을 고속도로',artist:'같이 가요 플레이리스트',len:214};
function shareSong(from){
  if(S.music||S.musicAsk)return;
  S.musicAsk={from,joined:{[from]:true},t:Date.now()};
  log('srv',`${nm(from)} → 그룹: '${SONG.title}' 같이 듣기 제안`);
  if(from!==S.view)toast(`${iga(from)} 같이 듣재요`,`'${SONG.title}' · 아래에서 같이 듣기를 눌러요`,4200);
  else toast('노래를 공유했어요','다른 차가 들어오면 같은 지점부터 함께 재생돼요',3500);
  S.ui.sheet=null;
}
function joinSong(id){
  const m=S.musicAsk;if(!m||m.joined[id])return;m.joined[id]=true;
  log('srv',`${nm(id)} 같이 듣기 참여 · 재생 위치 동기화`);
  if(IDS.every(i=>m.joined[i])){S.music={from:m.from,start:Date.now(),listeners:{...m.joined}};S.musicAsk=null;S.stats.songs++;toast('다 같이 듣는 중','세 차 모두 같은 지점부터 재생해요',3500);}
}
const PENALTY=[
  {k:'seat',label:'동승석 엉따 최강',sub:'시트 히터 3단계 · 60초',icon:'seat',sdk:'Vehicle SDK · 동승석 시트 히터 3단계 (60초 후 원래대로)'},
  {k:'ac',label:'동승석 에어컨 최강',sub:'동승석 18℃ · 풍량 최대 · 60초',icon:'snow',sdk:'Vehicle SDK · 동승석 공조 18℃, 풍량 최대 (60초 후 원래대로)'}
];
function startRoulette(by){
  if(S.roul)return;
  const target=IDS[Math.floor(Math.random()*3)],pen=PENALTY[Math.floor(Math.random()*2)];
  const idx=IDS.indexOf(target);
  // 바늘(위쪽)에 target 칸 중앙이 오도록: 칸 중심각 = idx*120+60
  const spins=4*360+(360-(idx*120+60))+(Math.random()*40-20);
  S.roul={by,target,pen,angle:spins,phase:'spin',t:Date.now()};
  S.ui.sheet=null;
  log('srv',`${nm(by)} 벌칙 룰렛 시작`);
}
function rouletteDone(){
  const r=S.roul;if(!r)return;r.phase='result';S.stats.roul++;
  S.pen={car:r.target,pen:r.pen,until:Date.now()+9000};
  log('srv',`룰렛 결과: ${nm(r.target)} · ${r.pen.label}`);
  log('sdk',`${nm(r.target)} ${r.pen.sdk}`);
  react(r.target,'걸렸다!',3000,'rest');
}

/* ======================= 행동 ======================= */
function act(a,arg){
  const v=S.view;
  switch(a){
    case 'view':S.view=arg;S.ui.sheet=null;S.ui.ask=false;S.cam=null;break;
    case 'create':S.lobby.step='invite';S.lobby.t=Date.now();log('srv',`그룹 생성: ${GROUP} · 초대 코드 ${CODE}`);break;
    case 'join':S.lobby.joined[v]=true;log('srv',`${nm(v)} 초대 코드로 참여`);break;
    case 'go':startDrive();break;
    case 'sheet':S.ui.sheet=arg;S.ui.ask=false;if(arg==='stop'&&!S.ui.reasonSet)S.ui.reason=(CAR[v].kind==='ev'&&C(v).battery<=25)?'charge':'toilet';break;
    case 'close':S.ui.sheet=null;S.ui.ask=false;break;
    case 'reason':S.ui.reason=arg;S.ui.reasonSet=true;break;
    case 'ask-stop':send(v,arg,S.ui.reason);break;
    case 'ask':S.ui.ask=true;S.ui.sheet=null;if(S.prop)S.ui.seen[S.prop.id]=true;S.ui.toast=null;break;
    case 'yes':vote(v,'yes');break;
    case 'no':vote(v,'no');break;
    case 'cancel-prop':if(S.prop&&S.prop.from===v){log('srv',`${nm(v)} 제안 취소`);S.prop=null;S.ui.ask=false;}break;
    case 'go-on':{const c=C(v);c.state='drive';c.rest=0;react(v,'출발!');log('srv',`${nm(v)} 다시 출발`);break;}
    case 'fit':S.ui.fit=!S.ui.fit;break;
    case 'zin':S.ui.fit=false;S.ui.zoom=Math.min(14,S.ui.zoom+.8);break;
    case 'zout':S.ui.fit=false;S.ui.zoom=Math.max(7,S.ui.zoom-.8);break;
    case 'nudge-yes':S.ui.reason='charge';S.ui.reasonSet=true;S.ui.sheet='stop';break;
    case 'nudge-no':S.ui.nudgeOff=C('A').battery;break;
    case 'share-song':shareSong(v);break;
    case 'join-song':joinSong(v);break;
    case 'stop-song':S.music=null;log('srv',`${nm(v)} 같이 듣기 종료`);break;
    case 'roulette':startRoulette(v);break;
    case 'roul-close':S.roul=null;break;
    case 'pen-cancel':if(S.pen){log('sdk',`${nm(S.pen.car)} 벌칙 취소 · 시트·공조 원래대로`);S.pen=null;}break;
    case 'toast':if(S.ui.toast&&S.ui.toast.open&&S.prop){S.ui.ask=true;S.ui.seen[S.prop.id]=true;}S.ui.toast=null;break;
    case 'end':S.ended=true;S.phase='ended';S.ui.sheet=null;S.ui.ask=false;S.music=null;log('srv','그룹 종료 · 모든 차량 위치 공유 중단');break;
    /* 콘솔 */
    case 'step':scene(+arg);return;
    case 'sim-B-toilet':send('B',nextRA('toilet'),'toilet');break;
    case 'sim-C-song':shareSong('C');break;
    case 'sim-B-roul':startRoulette('B');break;
    case 'sim-A-bat':C('A').battery=22;S.ui.nudgeOff=null;log('sdk','우리집 배터리 22% (Vehicle SDK · EV 배터리 잔량 이벤트)');break;
    case 'speed':S.speed=+arg;break;
    case 'auto':S.auto=!S.auto;break;
    case 'net':{const c=C(arg);c.online=!c.online;log('srv',`${nm(arg)} ${c.online?'다시 연결 · 최신 계획 v'+S.plan.v+' 받음':'연결 끊김 · 마지막 위치로 표시'}`);break;}
    case 'reset':S=fresh();S.cam=null;break;
  }
  ui();
}
function startDrive(){
  if(S.phase!=='lobby')return;
  IDS.forEach(id=>{S.lobby.joined[id]=true;const c=C(id);c.state='drive';});
  S.phase='drive';S.stats.startSim=S.sim;S.cam=null;
  log('srv',`모두 출발 · 계획 v1 배포 (목적지 ${DEST})`);
}
function scene(n){
  if(n===1){S=fresh();S.cam=null;}
  if(n>=2&&S.phase==='lobby')startDrive();
  if(n===3){ // 원주에서 합류
    const off={A:4000,B:-2500,C:9500};
    IDS.forEach(id=>{const c=C(id);c.s=SMERGE[id]+off[id];c.state='drive';c.rest=0;});
    S.sim=Math.max(S.sim,Math.round(SMERGE.A/RT.A.v)+300);S.cam=null;log('srv','시연: 원주 부근으로 이동');
  }
  if(n===4){if(S.phase!=='drive')scene(3);const k=nextRA('toilet');if(k)send('B',k,'toilet');}
  if(n===5){if(S.phase!=='drive')scene(3);C('A').battery=22;S.ui.nudgeOff=null;log('sdk','우리집 배터리 22% (Vehicle SDK · EV 배터리 잔량 이벤트)');}
  if(n===6){if(S.phase!=='drive')scene(3);shareSong('C');}
  if(n===7){if(S.phase!=='drive')scene(3);startRoulette('B');}
  if(n===8){if(S.phase==='lobby')startDrive();IDS.forEach(id=>{const c=C(id);c.s=RT[id].len-[1800,4200,3000][IDS.indexOf(id)];c.state='drive';});S.sim=Math.max(S.sim,Math.round(RT.A.dur*.98));S.cam=null;log('srv','시연: 강릉 도착 직전으로 이동');}
  S.step=n;ui();
}

/* ======================= 지도: 일러스트 / 실제 ======================= */
const TILE=512;
function merc(p){const x=(p[0]+180)/360,s=Math.sin(p[1]*R2D);return [x*TILE,(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*TILE];}
const W=1280,H=676;
const MAP={
  mode:'illu',gl:null,glReady:false,cam:{lng:127.9,lat:37.45,zoom:8},
  project(p){
    if(this.mode==='real'&&this.glReady){const q=this.gl.project(p);return [q.x,q.y];}
    const a=merc(p),c=merc([this.cam.lng,this.cam.lat]),k=2**this.cam.zoom;return [W/2+(a[0]-c[0])*k,H/2+(a[1]-c[1])*k];
  },
  setCam(c){
    this.cam=c;
    if(this.mode==='real'&&this.glReady){this.gl.jumpTo({center:[c.lng,c.lat],zoom:c.zoom});return;}
    const m=merc([c.lng,c.lat]),k=2**c.zoom;
    document.getElementById('illuG').setAttribute('transform',`translate(${(W/2-m[0]*k).toFixed(2)} ${(H/2-m[1]*k).toFixed(2)}) scale(${k.toFixed(4)})`);
  },
  lines(){ // 매 250ms 경로선 갱신
    const v=S.view,me=C(v),r=RT[v];
    const mine=slice(r,me.s,r.len),done=slice(r,0,me.s);
    const others=IDS.filter(i=>i!==v).map(i=>({id:i,pts:slice(RT[i],C(i).s,RT[i].len)}));
    if(this.mode==='real'&&this.glReady){
      const fc=(arr)=>({type:'FeatureCollection',features:arr});
      const ls=(pts,props)=>({type:'Feature',properties:props||{},geometry:{type:'LineString',coordinates:pts}});
      this.gl.getSource('me')?.setData(fc([ls(mine)]));
      this.gl.getSource('done')?.setData(fc([ls(done)]));
      this.gl.getSource('others')?.setData(fc(others.map(o=>ls(o.pts,{c:col(o.id)}))));
      return;
    }
    const d=pts=>'M'+pts.map(p=>{const m=merc(p);return m[0].toFixed(4)+' '+m[1].toFixed(4);}).join('L');
    const set=(id,val)=>{const e=document.getElementById(id);if(e)e.setAttribute('d',val);};
    set('l-me',d(mine));set('l-done',d(done));
    others.forEach((o,i)=>{const e=document.getElementById('l-o'+i);if(e){e.setAttribute('d',d(o.pts));e.setAttribute('stroke',col(o.id));}});
  },
  flash(){
    if(this.mode==='real'&&this.glReady){const g=this.gl;g.setPaintProperty('me-line','line-width',12);setTimeout(()=>g.setPaintProperty('me-line','line-width',7),900);return;}
    const e=document.getElementById('l-me');if(!e)return;e.classList.remove('fl');void e.getBoundingClientRect();e.classList.add('fl');
  },
  drawIllu(){
    const pts=r=>'M'+r.pts.map(p=>{const m=merc(p);return m[0].toFixed(4)+' '+m[1].toFixed(4);}).join('L');
    const coast=[[128.62,38.6],[128.75,38.1],[128.95,37.85],[129.07,37.68],[129.2,37.45],[129.35,37.1],[129.45,36.6],[131,36.6],[131,38.6]];
    const poly='M'+coast.map(p=>{const m=merc(p);return m[0].toFixed(4)+' '+m[1].toFixed(4);}).join('L')+'Z';
    const han=[[126.6,37.62],[126.85,37.58],[126.98,37.52],[127.1,37.53],[127.25,37.55],[127.35,37.5],[127.5,37.4],[127.65,37.3],[127.8,37.2]];
    const river='M'+han.map(p=>{const m=merc(p);return m[0].toFixed(4)+' '+m[1].toFixed(4);}).join('L');
    const ns='vector-effect="non-scaling-stroke"';
    document.getElementById('illuG').innerHTML=`
      <rect x="0" y="0" width="${TILE}" height="${TILE}" fill="#EEF1F0"/>
      <path d="${poly}" fill="#D6E7F1"/>
      <path d="${river}" fill="none" stroke="#D6E7F1" stroke-width="7" ${ns} stroke-linecap="round"/>
      ${IDS.map(id=>`<path d="${pts(RT[id])}" fill="none" stroke="#D5DBE0" stroke-width="11" ${ns} stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
      ${IDS.map(id=>`<path d="${pts(RT[id])}" fill="none" stroke="#FFFFFF" stroke-width="7" ${ns} stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
      <path id="l-done" fill="none" stroke="#B4BCC4" stroke-width="5" ${ns} stroke-linecap="round" stroke-linejoin="round"/>
      <path id="l-o0" fill="none" stroke-width="3.5" stroke-opacity=".55" ${ns} stroke-linecap="round" stroke-linejoin="round"/>
      <path id="l-o1" fill="none" stroke-width="3.5" stroke-opacity=".55" ${ns} stroke-linecap="round" stroke-linejoin="round"/>
      <path id="l-me" fill="none" stroke="#087F70" stroke-width="7" ${ns} stroke-linecap="round" stroke-linejoin="round"/>
      <style>#l-me.fl{animation:fl 1s ease-out}@keyframes fl{0%{stroke-width:14px;stroke:#3CC4B0}100%{stroke-width:7px}}</style>`;
  },
  initReal(){
    const self=this;
    return new Promise((res,rej)=>{
      const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css';document.head.appendChild(css);
      const sc=document.createElement('script');sc.src='https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js';
      const to=setTimeout(()=>rej(new Error('timeout')),20000);
      sc.onerror=()=>{clearTimeout(to);rej(new Error('script'));};
      sc.onload=()=>{
        try{
          const el=document.getElementById('gl');el.hidden=false;
          const g=new maplibregl.Map({container:el,style:STYLE_URL,center:[127.9,37.45],zoom:8,interactive:false,attributionControl:{compact:true},fadeDuration:0});
          g.on('error',e=>{if(!self.glReady){clearTimeout(to);rej(e.error||e);}});
          g.on('load',()=>{
            clearTimeout(to);
            const empty={type:'FeatureCollection',features:[]};
            ['done','others','me'].forEach(s=>g.addSource(s,{type:'geojson',data:empty}));
            g.addLayer({id:'done-line',type:'line',source:'done',paint:{'line-color':'#B4BCC4','line-width':5},layout:{'line-cap':'round','line-join':'round'}});
            g.addLayer({id:'others-line',type:'line',source:'others',paint:{'line-color':['get','c'],'line-width':3.5,'line-opacity':.6},layout:{'line-cap':'round','line-join':'round'}});
            g.addLayer({id:'me-casing',type:'line',source:'me',paint:{'line-color':'#FFFFFF','line-width':11},layout:{'line-cap':'round','line-join':'round'}});
            g.addLayer({id:'me-line',type:'line',source:'me',paint:{'line-color':'#087F70','line-width':7,'line-width-transition':{duration:600}},layout:{'line-cap':'round','line-join':'round'}});
            self.gl=g;self.glReady=true;el.classList.add('on');console.info('[gachi] 실제 지도 준비됨');setTimeout(()=>{document.getElementById('illu').style.display='none';},450);res();
          });
        }catch(e){clearTimeout(to);rej(e);}
      };
      document.head.appendChild(sc);
    });
  }
};

/* ======================= 화면 그리기 ======================= */
function statusOf(id){
  const c=C(id),v=S.view;
  if(!c.online)return '연결 끊김';
  if(S.phase==='lobby')return S.lobby.joined[id]?'출발 준비 완료':'초대 보냄';

function place(){

  let tgt;
  if(S.phase!=='drive'||S.ui.fit){
    const ps=S.phase==='lobby'?[...IDS.map(i=>RT[i].pts[0]),RT.A.pts[RT.A.pts.length-1]]:[...IDS.map(i=>at(RT[i],C(i).s)),...S.plan.stops.filter(k=>SSTOP[v][k]>me.s).map(k=>RA[k].at)];
    if(S.phase==='drive'){const nt=nextTurn(v);if(nt)ps.push(at(RT[v],Math.min(RT[v].len,me.s+nt.d)));}
    const ms=ps.map(merc);const x0=Math.min(...ms.map(m=>m[0])),x1=Math.max(...ms.map(m=>m[0])),y0=Math.min(...ms.map(m=>m[1])),y1=Math.max(...ms.map(m=>m[1]));
    const padL=S.phase==='lobby'?120:390,padR=S.phase==='lobby'?120:340,padT=110,padB=S.phase==='lobby'?110:150;
    const z=Math.log2(Math.min((W-padL-padR)/Math.max(1e-9,x1-x0),(H-padT-padB)/Math.max(1e-9,y1-y0)));
    const zz=Math.max(6.5,Math.min(12.5,z));const k=2**zz;
    const cx=(x0+x1)/2+((padR-padL)/2)/k,cy=(y0+y1)/2+((padB-padT)/2)/k;
    const lng=cx/TILE*360-180,lat=Math.atan(Math.sinh(Math.PI*(1-2*cy/TILE)))/R2D;
    tgt={lng,lat,zoom:zz};
  }else{
    // 내 차를 화면 왼쪽 아래쪽에 두고 앞길을 보이게

    tgt={lng:cx/TILE*360-180,lat:Math.atan(Math.sinh(Math.PI*(1-2*cy/TILE)))/R2D,zoom:S.ui.zoom};
  }
  if(!S.cam)S.cam={...tgt};
  const q=.1;S.cam.lng+=(tgt.lng-S.cam.lng)*q;S.cam.lat+=(tgt.lat-S.cam.lat)*q;S.cam.zoom+=(tgt.zoom-S.cam.zoom)*q;
  MAP.setCam(S.cam);

  document.querySelectorAll('#ov [data-car]').forEach(e=>{
    const id=e.dataset.car,c=C(id),r=RT[id];const p=at(r,c.s),p2=at(r,Math.min(r.len,c.s+120)),p0=at(r,Math.max(0,c.s-120));

}

      <button class="kb" data-act="sheet" data-arg="play" ${!c.online?'disabled':''}>${I.sparkle()}함께 놀기</button>
      ${waiting?`<button class="kb y" data-act="ask">${I.q('#1B2430',18)}${p.from===v?'대답 보기':'질문 보기'}</button>`:''}</div>`;
    h+=`<div class="zoom"><button data-act="zin" aria-label="확대">+</button><button data-act="zout" aria-label="축소">−</button><button class="fit" data-act="fit" aria-pressed="${S.ui.fit}" aria-label="모든 차 보기">전체</button></div>`;
    if(S.music&&S.music.listeners[v]){const el=((Date.now()-S.music.start)/1000)%SONG.len;
      h+=`<div class="mini card">${'<span class="art">'+I.music('#fff',20)+'</span>'}<div><div class="t">${SONG.title}</div><div class="s">${SONG.artist} · 같이 듣는 중</div></div><div class="avs">${IDS.map(i=>av(i)).join('')}</div><div class="prog"><i data-live="prog" style="width:${(el/SONG.len*100).toFixed(1)}%"></i></div><button class="kb o sm" data-act="stop-song">그만 듣기</button></div>`;}
    else if(S.musicAsk&&!S.musicAsk.joined[v])h+=`<div class="mini card"><span class="art">${I.music('#fff',20)}</span><div><div class="t">${iga(S.musicAsk.from)} 같이 듣재요</div><div class="s">'${SONG.title}' · ${SONG.artist}</div></div><button class="kb p sm" data-act="join-song">같이 듣기</button></div>`;
    else if(S.musicAsk&&S.musicAsk.joined[v])h+=`<div class="mini card"><span class="art">${I.music('#fff',20)}</span><div><div class="t">다른 차를 기다리는 중</div><div class="s">${IDS.filter(i=>S.musicAsk.joined[i]).length}/3 참여</div></div></div>`;
    else if(v==='A'&&c.battery<=25&&!p&&!S.ui.sheet&&!rest&&!(S.ui.nudgeOff!=null&&c.battery>S.ui.nudgeOff-5)){
      const k=nextRA('charge');
      h+=`<div class="nudge card">${I.bolt('#087F70',20)}<span>배터리 <b class="num">${c.battery}%</b>${k?` · ${RA[k].name}에 급속충전기가 있어요`:''}</span><button class="kb p sm" data-act="nudge-yes" ${k?'':'disabled'}>같이 충전하자고 하기</button><button class="kb o sm" data-act="nudge-no">괜찮아요</button></div>`;}
    if(S.ui.toast&&S.ui.toast.until>Date.now())h+=`<button class="toast" data-act="toast">${esc(S.ui.toast.t)}<small>${esc(S.ui.toast.s)}</small></button>`;
    if(S.pen&&S.pen.until>Date.now()&&S.pen.car===v)h+=`<div class="pen">${S.pen.pen.k==='seat'?I.seat('#FFC845',26):I.snow('#9FE3D8',26)}<div><b>벌칙 · ${S.pen.pen.label}</b><small>${S.pen.pen.sub} · 운전석은 그대로예요</small></div><button class="kb" data-act="pen-cancel">봐주기</button></div>`;
    else if(S.pen&&S.pen.until>Date.now())h+=`<div class="pen">${I.dice('#FFC845',24)}<div><b>${iga(S.pen.car)} 걸렸어요</b><small>${S.pen.pen.label} · 1분</small></div></div>`;
    if(S.ui.ask)h+=askHTML();
    h+=sheetHTML();
  }
  document.getElementById('ui').innerHTML=h;
  document.getElementById('cover').innerHTML=coverHTML();
  const rk=S.roul&&S.phase==='drive'?S.roul.phase+S.roul.t:'';
  if(rk!==ui.rk){ui.rk=rk;document.getElementById('rlbox').innerHTML=S.phase==='drive'?rouletteHTML():'';
    if(S.roul&&!S.roul.applied){S.roul.applied=true;const t0=S.roul.t;requestAnimationFrame(()=>requestAnimationFrame(()=>{const w=document.getElementById('wheel');if(w)w.style.transform=`rotate(${S.roul.angle}deg)`;}));setTimeout(()=>{if(S.roul&&S.roul.t===t0&&S.roul.phase==='spin'){rouletteDone();ui();}},2800);}}
  document.querySelectorAll('.vbtn').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.arg===S.view)));
  MAP.lines();
  renderConsole();
  place();
}

/* ======================= 콘솔 ======================= */
const STEPS=[[1,'그룹 만들기·초대'],[2,'다 같이 출발'],[3,'원주에서 합류 (건너뛰기)'],[4,'큰집: 화장실 급해요'],[5,'우리집 배터리 22%'],[6,'작은집: 같이 듣기'],[7,'큰집: 벌칙 룰렛'],[8,'강릉 도착 (건너뛰기)']];
function hint(){
  const p=S.prop,v=S.view,c=C(v);
  if(S.phase==='ended')return '그룹이 끝나 위치 공유가 멈췄어요. 1번부터 다시 시연할 수 있어요.';
  if(S.phase==='lobby')return S.lobby.step==='create'?'우리집 화면에서 ‘그룹 만들고 초대하기’를 눌러 보세요. 위쪽에서 큰집·작은집 화면으로 바꾸면 초대받는 쪽도 볼 수 있어요.':'초대받은 차들이 참여하면 ‘같이 출발’을 눌러요. 2번을 눌러도 바로 출발해요.';
  if(c.state==='arrived')return '도착하면 함께 달린 기록이 추억 카드로 남아요. 그룹을 끝내면 위치 공유도 멈춰요.';
  if(c.state==='rest')return '휴게소에 도착했어요. ‘출발 준비 완료’를 누르면 다시 출발해요.';
  if(p&&p.status==='open'){if(p.from!==v&&!p.votes[v])return `${nm(p.from)} 차 옆에 노란 말풍선이 떴어요. 눌러서 ‘좋아요’를 누르면, 모두 동의하는 순간 경로가 바뀌어요.`;return S.auto?'다른 차들이 곧 대답해요.':'자동 대답이 꺼져 있어요. 위에서 다른 차 화면으로 바꿔 직접 대답해 보세요.';}
  if(S.musicAsk&&!S.musicAsk.joined[v])return '아래 ‘같이 듣기’를 누르면 세 차가 같은 지점부터 같은 노래를 들어요.';
  if(S.roul)return '룰렛이 멈추면 걸린 차의 동승석 시트 히터나 에어컨이 Vehicle SDK로 1분 동안 켜져요. 운전석은 건드리지 않아요.';
  const m=Math.min(...IDS.map(i=>C(i).s-SMERGE[i]));
  if(m<-3000)return '세 차가 서로 다른 길로 오고 있어요. 3번으로 원주 합류 지점까지 건너뛰거나, 속도를 올려 보세요.';
  return '4~7번을 차례로 눌러 휴게소 제안, 충전 제안, 같이 듣기, 벌칙 룰렛을 볼 수 있어요. 아래 버튼으로 직접 제안해도 돼요.';
}
function renderConsole(){
  const busy=S.phase!=='drive';
  const c=C('A');
  document.getElementById('console').innerHTML=`
  <section class="cb hint"><h3>다음에 해볼 것</h3><p>${hint()}</p></section>
  <section class="cb"><h3>시연 순서</h3><p class="n">누르면 그 장면으로 바로 가요.</p><div class="steps">${STEPS.map(([n,t])=>`<button class="stp" data-act="step" data-arg="${n}" ${S.step===n?'aria-current="step"':''}><i>${n}</i><span>${t}</span></button>`).join('')}</div></section>
  <section class="cb"><h3>차량 데이터 (Vehicle SDK)</h3><p class="n">에뮬레이터에서 읽는 값을 흉내 냈어요.</p><div class="vlive">
    <span>우리집 배터리</span><span data-live="v-bat">${c.battery}%</span>
    <span>우리집 속도</span><span data-live="v-kmh">${Math.round(c.kmh)} km/h</span>
    <span>큰집 연료</span><span>${C('B').fuel}%</span>
    <span>작은집 연료</span><span>${C('C').fuel}%</span></div></section>
  <section class="cb"><h3>시연 설정</h3>
    <div class="row2"><span>다른 차 자동 대답</span><button class="sw" role="switch" aria-checked="${S.auto}" data-act="auto" aria-label="다른 차 자동 대답"></button></div>
    <div class="row2"><span>재생 속도</span><span class="seg">${SPEEDS.map(([s,l])=>`<button data-act="speed" data-arg="${s}" aria-pressed="${S.speed===s}">${l}</button>`).join('')}</span></div>
    ${IDS.map(id=>`<div class="row2"><span>${nm(id)} 연결</span><button class="sw" role="switch" aria-checked="${C(id).online}" data-act="net" data-arg="${id}" aria-label="${nm(id)} 연결"></button></div>`).join('')}
  </section>
  <section class="cb"><h3>기록</h3><p class="n">서버: 그룹 서버 · SDK: 차량 제어</p><ul class="log">${S.log.length?S.log.map(l=>`<li><time>${l.t}</time><span class="lt ${l.kind}">${l.kind==='sdk'?'SDK':'서버'}</span><span>${esc(l.m)}</span></li>`).join(''):'<li><time></time><span></span><span style="color:var(--muted)">아직 기록이 없어요.</span></li>'}</ul></section>
  <button class="reset" data-act="step" data-arg="1">처음부터</button>`;
}

/* ======================= 루프 ======================= */
let dirty=false,last=performance.now();
function step(dt){
  if(S.phase!=='drive')return;
  S.sim+=dt*RATE;
  IDS.forEach(id=>{
    const c=C(id),r=RT[id];
    if(c.state==='drive'){
      const ns=c.s+r.v*dt*RATE;
      let stopped=false;
      for(const k of S.plan.stops){const sd=SSTOP[id][k];if(c.s<sd&&ns>=sd){c.s=sd;c.state='rest';c.at=k;c.rest=(S.plan.stay[k]||10)*60;react(id,'도착!',2600);log('srv',`${nm(id)} ${RA[k].name} 도착`);if(id==='A'&&S.plan.stay[k]>=25){c.battery=Math.min(80,c.battery+38);log('sdk','우리집 급속충전 완료 · 배터리 '+c.battery+'%');}dirty=true;stopped=true;break;}}
      if(!stopped){c.s=Math.min(r.len,ns);if(c.s>=r.len){c.state='arrived';react(id,'도착!',3000);log('srv',`${nm(id)} ${DEST} 도착`);dirty=true;}}
      c.kmh=c.state==='drive'?(r.v*3.6)*(0.92+0.1*Math.sin(S.sim/90+IDS.indexOf(id))):0;
      if(id==='A'&&c.state==='drive'){c.drain+=dt*RATE;if(c.drain>=420){c.drain=0;if(c.battery>6){c.battery--;if(c.battery===25)dirty=true;}}}
    }else if(c.state==='rest'){
      c.rest-=dt*RATE;
      if(id!==S.view&&c.rest<=0){c.state='drive';react(id,'출발!');log('srv',`${nm(id)} 다시 출발`);dirty=true;}
      if(id===S.view&&c.rest<=-600){c.state='drive';dirty=true;}
    }
  });
}
function periodic(){
  const now=Date.now(),p=S.prop;
  if(S.phase==='lobby'&&S.lobby.step==='invite'){
    const t=now-S.lobby.t;
    if(!S.lobby.joined.B&&t>1600&&S.view!=='B'){S.lobby.joined.B=true;log('srv','큰집 초대 코드로 참여');dirty=true;}
    if(!S.lobby.joined.C&&t>3400&&S.view!=='C'){S.lobby.joined.C=true;log('srv','작은집 초대 코드로 참여');dirty=true;}
  }
  if(p&&p.status==='open'&&S.auto)IDS.forEach((id,i)=>{if(id===S.view||p.votes[id]||!C(id).online)return;if(now-p.t>1700+i*900){vote(id,'yes');dirty=true;}});
  if(p&&p.status!=='open'&&now-p.done>2600){S.prop=null;S.ui.ask=false;dirty=true;}
  if(S.musicAsk&&S.auto)IDS.forEach((id,i)=>{if(id===S.view||S.musicAsk?.joined[id])return;if(now-S.musicAsk.t>1500+i*800){joinSong(id);dirty=true;}});
  const n0=S.reacts.length;S.reacts=S.reacts.filter(r=>r.until>now);if(S.reacts.length!==n0)dirty=true;
  if(S.ui.toast&&S.ui.toast.until<=now){S.ui.toast=null;dirty=true;}
  if(S.ui.lastDiff&&S.ui.lastDiff.until<=now){S.ui.lastDiff=null;dirty=true;}
  if(S.pen&&S.pen.until<=now){log('sdk',`${nm(S.pen.car)} 벌칙 끝 · 시트·공조 원래대로`);S.pen=null;dirty=true;}
  const nt=S.phase==='drive'?nextTurn(S.view):null,key=(nt?nt.w:'')+C(S.view).state+S.phase;
  if(periodic.k!==key){periodic.k=key;dirty=true;}
}
function live(){
  const v=S.view,c=C(v);
  const q=(sel,t)=>{const e=document.querySelector(`[data-live="${sel}"]`);if(e&&e.innerHTML!==t)e.innerHTML=t;};
  q('clock',clock());
  if(S.phase==='drive'){
    q('eta',`${clock(remainSec(v))} <span>도착</span>`);q('rem',`${km(RT[v].len-c.s)} · ${durs(remainSec(v))} 남음 · ${DEST}`);
    const nt=nextTurn(v);if(nt)q('tdist',km(nt.d));
    IDS.forEach(id=>q('st-'+id,statusOf(id)));
    q('kmh',`${c.state==='drive'?Math.round(c.kmh):0} km/h`);q('v-bat',`${C('A').battery}%`);q('v-kmh',`${Math.round(C('A').kmh)} km/h`);
    const pg=document.querySelector('[data-live="prog"]');if(pg&&S.music){pg.style.width=((((Date.now()-S.music.start)/1000)%SONG.len)/SONG.len*100).toFixed(1)+'%';}
  }
  MAP.lines();
}
function frame(ts){
  const dt=Math.min(.1,(ts-last)/1000)*S.speed;last=ts;
  step(dt);
  if(!frame.t||ts-frame.t>250){frame.t=ts;periodic();if(dirty){dirty=false;ui();}else live();}
  place();
  requestAnimationFrame(frame);
}

/* ======================= 시작 ======================= */
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;act(t.dataset.act,t.dataset.arg);});
function fit(){const st=document.getElementById('stage');const s=Math.max(.25,Math.min(1,st.clientWidth/1304));document.documentElement.style.setProperty('--s',s.toFixed(4));}
new ResizeObserver(fit).observe(document.getElementById('stage'));
S=fresh();
MAP.drawIllu();
const h=location.hostname,tok=location.hash.replace('#','').split('-');
const wantReal=tok.includes('real')||(!tok.includes('illust')&&(h.endsWith('github.io')||h==='localhost'||h==='127.0.0.1'||location.protocol==='file:'));
const sc=tok.map(t=>/^s([1-8])$/.exec(t)).find(Boolean);
const foot=m=>{document.getElementById('foot').innerHTML=`시연용 화면이에요. 경로는 OSRM으로 미리 계산한 실제 도로 경로이고, 차량 위치는 그 경로를 따라 약 30배속으로 움직여요. 지도: <b>${m}</b>. 배터리·시트·공조 값은 Vehicle SDK 에뮬레이터 값을 흉내 냈고, 그룹 서버 동작도 이 페이지 안에서 흉내 냈어요.`;};
foot('일러스트 지도');
fit();ui();if(sc){const n=+sc[1];for(let i=2;i<=n;i++){if(i===3||i===n||i===8||i===2)scene(i);}}requestAnimationFrame(t=>{last=t;frame(t);});
if(wantReal){MAP.mode='real';MAP.initReal().then(()=>{foot('실제 지도 · © OpenFreeMap, OpenStreetMap');S.cam=null;dirty=true;}).catch(err=>{console.warn('[gachi] 실제 지도 실패:',err&&(err.message||err));MAP.mode='illu';MAP.gl=null;MAP.glReady=false;document.getElementById('gl').hidden=true;document.getElementById('illu').style.display='';foot('일러스트 지도 (실제 지도를 불러오지 못했어요)');dirty=true;});}
})();
</script>
</body>
</html>
